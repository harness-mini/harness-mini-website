name: Release

# Production is release-gated. A semver tag (vX.Y.Z) builds the site and deploys
# it to Vercel PRODUCTION via the Vercel CLI, then publishes a GitHub Release.
# (Pushes to main only get previews — see site/vercel.json.)

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release & deploy to Vercel (production)
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history for release notes

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      # Run from the repo root: the Vercel project's Root Directory is `site/`,
      # so the CLI resolves rootDirectory relative to here (./site). Running
      # inside site/ would make it look for site/site.
      - name: Pull Vercel project settings (production)
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build (production)
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt to Vercel (production)
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "## Deployed ${GITHUB_REF_NAME} to production" >> "$GITHUB_STEP_SUMMARY"
          echo "- $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          notes="$(gh release view "$GITHUB_REF_NAME" --json body -q .body)"
          header="🚀 **Live:** https://harness-mini-website.vercel.app"$'\n'"**Deployed:** $DEPLOY_URL"$'\n\n'"---"$'\n\n'
          gh release edit "$GITHUB_REF_NAME" --notes "${header}${notes}"
